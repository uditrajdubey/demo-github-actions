
# GOAL: To check if python code is syntactically correct 

#  Name of the workflow

name : code lint and test and using matrix concept for python version

# this workflow should run automatically on every push 
on:
  push:

jobs:

# Name of the jobs 
  code-linter-and-test-and-using-matrix-concept:
    strategy:
      matrix:
        python-versions: ['3.13' , '3.14' , '3.15']

# name of the Os on which job  runs / this job runs on ubuntu latest 
    runs-on: ubuntu-latest

    steps:

# First step is for to clone the github code 
      - name: code checkout
        uses: actions/checkout@v7  # This is the github actions used it works same as git clone .repo code url.


# after code checkout we need to setup/install python because our goal is to check python code
      - name: setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-versions }}

# Now, after installing or setup the  python we can can install  all the dependencies

      - name: Install dependencies
        run: pip install -r requirements.txt  

# Now after setup the python and installing dependencies we do is -  which is the most popular linter is used in python - its ruff

      - name: code linter for python
        run: ruff check .  # now 1 ques does my ubuntu has ruff installed -- anser is  NO , so we will write the ruff
                           # in requirements.txt file and then push the changes in githib and then see the Github actions

      - name: python code test 
        run: pytest                   