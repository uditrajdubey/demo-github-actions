# Goal: to scan the build docker image before push 

name: trivy scan

on: 
  workflow_call:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      
      - name: code setup
        uses: actions/checkout@v7

      - name: docker setup
        uses: docker/setup-docker-action@v5  

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      -  name: Build and push  
         uses: docker/build-push-action@v7
         with:
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/e-comm-python:latest 
          load: true 

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/e-comm-python:latest'
          format: 'table'
          exit-code: '1' # CRITICAL step: Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true # Ignores vulnerabilities that don't have a vendor patch yet
          severity: 'CRITICAL'
   

